reference: |
  ## Comentário de revisão

  Obrigado pelo PR — o fluxo está correto e os testes cobrem o caminho feliz. Antes da Black Friday, tem alguns pontos
  que vão nos derrubar em produção. Listei por prioridade.

  ### 1. Bloqueante: chamadas HTTP dentro da transação do banco
  `@Transactional` cobre o método inteiro, e dentro dele chamamos `inventoryClient.reserve(...)` por item e
  `paymentClient.charge(...)`. A transação (e a conexão do pool) fica aberta durante toda a ida à rede. Com
  {{itemsPerOrder}} itens médios e {{ordersPerSecond}} pedidos/s, as 750 conexões (30 pods × 25) ficam presas esperando
  I/O e o `orders-db` satura antes do pico real.

  Sugiro: transação curta só para persistir o pedido e a linha de outbox; reserva de estoque e cobrança fora dela,
  orquestradas por evento (saga) ou, no mínimo, depois do commit, com estado intermediário no pedido.

  ### 2. Bloqueante: SQL concatenado
  ```java
  jdbc.update("insert into order_items (...) values (" + order.getId() + ", '" + item.getSku() + "', ...)");
  ```
  `sku` vem do cliente: é injeção de SQL. Use parâmetros vinculados (`jdbc.update(sql, args...)`) ou o repositório JPA
  que já existe para as outras entidades.

  ### 3. Bloqueante: token de cartão no log
  ```java
  System.out.println("pedido ... cartao " + request.getCardToken() + ...);
  ```
  Token de cartão e identificador do cliente em log viola LGPD e nossa política de PCI. Troque por log estruturado
  (`log.info("order.created", kv("orderId", id))`), sem dado sensível.

  ### 4. Importante: N+1 nas consultas de produto
  Um `findBySku` por item = {{queriesPerOrder}} idas ao banco por pedido (~{{queriesPerSecond|compact}} consultas/s no pico).
  Sugiro `findAllBySkuIn(skus)` uma vez, antes do laço.

  ### 5. Importante: sem idempotência
  Se o gateway reenviar por timeout, criamos outro pedido e cobramos de novo. A tabela `orders` já tem
  `uq_orders_idempotency`: receba a chave no cabeçalho, persista junto e devolva o pedido existente quando ela repetir.

  ### 6. Estrutural: regra de negócio no controller
  O desconto progressivo e o cupom são regra de domínio. No controller não dá para testar sem subir HTTP, e o cálculo
  vai ser reescrito quando o app ou o `seller-api` precisarem dele. Sugiro `OrderPricing.calculate(items, coupon)` no
  domínio, com teste unitário — inclusive porque hoje a ordem dos descontos (progressivo antes do cupom) não está
  documentada em lugar nenhum.

  ### Menores
  - `@Autowired` em campo dificulta teste: prefira injeção por construtor.
  - `new Date()` em vez de `Instant.now()` via porta de relógio (o time já usa `Clock` nos outros serviços).
  - Retornar `Map<String, Object>` expõe estrutura sem contrato: use um DTO de resposta.
  - `throw new RuntimeException("pagamento recusado")` dentro de `@Transactional` vira 500 e faz rollback de um pedido
    que deveria existir com status `PAGAMENTO_RECUSADO`.

  Posso pareá-lo amanhã de manhã para quebrar a transação — é a parte mais chata e a que mais muda o PR.
scenario:
  kind: none
