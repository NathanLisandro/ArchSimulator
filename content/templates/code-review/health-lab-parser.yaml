      help: "Escreva como deixaria no PR: o que muda, por que, e com qual prioridade."
reference: |
  ## Comentário de revisão

  Obrigado por atacar essa integração, e desculpa o comentário longo: parte do que está aqui é do padrão que a gente
  usa nos outros parsers, não do seu PR. Vale corrigir nos dois lugares.

  ### 1. Bloqueante, risco clínico: casamento por nome
  ```java
  List<Patient> byName = patients.findByFullName(name);
  if (byName.size() > 0) { patient = byName.get(0); }
  ```
  Com 9,2 milhões de pacientes, homônimo não é exceção: é rotina. Pegar o primeiro significa anexar exame de uma
  pessoa ao prontuário de outra, que é evento adverso com notificação obrigatória — e que só aparece quando alguém
  percebe um resultado impossível.

  Sugiro casar pelo identificador do laboratório (`lab_orders.external_id` com `lab_id`), que é o único par
  inequívoco que temos. Quando não houver correspondência, a linha vai para revisão manual com o motivo, e **não**
  é anexada a ninguém. É melhor um resultado pendente do que um resultado no paciente errado.

  ### 2. Bloqueante: a falha desaparece
  ```java
  } catch (Exception e) { System.out.println("erro na linha: " + line); }
  ```
  Três problemas em uma linha: o `catch (Exception)` engole inclusive erro de programação; o `println` não é alarme e
  ninguém lê; e a linha impressa contém nome, documento e resultado de exame, ou seja, dado pessoal sensível em log,
  o que é violação de LGPD.

  Sugiro: exceções específicas por tipo de falha, log estruturado sem conteúdo clínico (só identificadores internos),
  e a mensagem indo para a DLQ de propósito, não por acidente.

  ### 3. Bloqueante: a DLQ não tem dono
  São {{dlqPending|number}} mensagens acumuladas e ninguém sabe desde quando. Cada uma pode ser um resultado que o
  médico não viu. Precisa de alarme por **quantidade** e por **idade da mensagem mais antiga**, runbook de
  reprocessamento e um responsável nomeado.

  ### 4. Importante: reprocessamento duplica efeitos
  A fila entrega ao menos uma vez. Hoje, reprocessar anexa o resultado de novo e manda outra notificação ao paciente.
  Sugiro chave de idempotência por `(lab_id, external_id, panel_code)` persistida com restrição de unicidade, e a
  notificação disparada só quando o pedido muda de estado de fato.

  ### 5. Importante: leitura posicional sem validação
  `line.substring(0, 40)` estoura em qualquer linha mais curta — cabeçalho, rodapé, linha em branco no fim do arquivo.
  Sugiro validar o tamanho e o formato de cada campo antes de usar, com mensagem clara de qual posição falhou.

  ### Menores
  - `new Date()` em vez do relógio injetado que o resto do serviço usa.
  - `@Autowired` em campo dificulta teste; prefira construtor.
  - `content.split("\n")` quebra com arquivo em CRLF, que é o formato mais provável vindo de sistema de laboratório.
  - Ler o arquivo inteiro na memória: alguns desses arquivos passam de 100 MB em dia de pico.

  ### Sobre o prazo
  Sei do compromisso desta semana. Proponho o seguinte corte: os itens 1, 2 e 3 entram agora, porque são risco
  clínico e de privacidade. O 4 e o 5 viram ticket para a semana seguinte, com meu nome junto. Se ajudar, eu pareio
  contigo amanhã de manhã no item 1, que é o que mais muda o código.
scenario:
  kind: none
recommendation:
  default: structural-review
  rules:
    - { param: dlqPending, op: ">=", value: 2000, path: block-and-fix-pattern, reason: "com {{dlqPending|number}} mensagens paradas o defeito claramente já está nos outros parsers; corrigir só este PR deixa o mesmo risco de paciente errado nos {{labsLegacy}} laboratórios legados" }
