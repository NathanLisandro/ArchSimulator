reference: |
  ## Escolha: transactional outbox

  ### Por que
  O problema aqui é **evento perdido e evento fantasma**, não duplicata. Duplicata tem solução barata e local:
  idempotência no consumidor por `end_to_end_id` — o `{{consumer}}` já recebe essa chave.

  Com {{tps}} TPS no pico e SLA de liquidação em 10s, a latência do caminho crítico é requisito. Outbox mantém **uma
  transação local**: a mesma que grava em `pix_transactions` grava a linha na `outbox`. Publicar depois, fora do request,
  não atrasa o cliente. 2PC adiciona pelo menos dois round-trips de coordenação por transação e mantém locks abertos
  durante o prepare, no `core-db` que já sustenta cartão e ledger.

  ### O pior modo de falha de cada opção
  - **Outbox:** o relay para. Consequência: atraso na publicação, medido pelo lag da tabela; nada se perde, nada fica
    travado, e a recuperação é retomar o relay. Alerta em "linha mais antiga não publicada > 60s".
  - **2PC:** o coordenador cai entre prepare e commit. Consequência: transações **in-doubt** segurando locks no core-db
    até alguém resolver manualmente. Com uma squad de {{teamSize}} pessoas, isso é uma classe nova de incidente às 3 da manhã.

  ### O que se perde com o outbox, assumido conscientemente
  - **Entrega ao menos uma vez:** o consumidor precisa ser idempotente. É trabalho real, mas local e testável.
  - **Ordem:** garantida por chave (particionar por `account_id`), não globalmente.
  - **Mais uma peça:** tabela `outbox` + relay (poller com `FOR UPDATE SKIP LOCKED`, ou CDC via Debezium quando o volume
    justificar), com monitoramento de lag e política de limpeza das linhas publicadas.

  ### Quando a resposta seria outra
  Se os dois participantes fossem bancos relacionais com XA maduro, o volume fosse baixo e a operação já tivesse
  coordenador transacional em produção, 2PC seria defensável. Com Kafka como participante — que não é XA de primeira
  classe — e {{tps}} TPS, não é.
scenario:
  kind: none
recommendation:
  default: outbox
  rules: []
