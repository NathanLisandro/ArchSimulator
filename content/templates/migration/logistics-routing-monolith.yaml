  pathField: solutionPath
  fields:
    - id: strategy
      label: "Estratégia de migração"
      type: SELECT
      required: true
      options:
        - { value: PARALLELIZE, label: "Paralelizar por hub, com isolamento" }
        - { value: CHECKPOINT, label: "Manter sequencial com checkpoint" }
        - { value: EXTRACT_SERVICE, label: "Extrair a otimização como serviço" }
        - { value: BIG_BANG, label: "Reescrever e trocar de uma vez" }
    - id: rolloutStrategy
      label: "Estratégia de rollout"
      type: SELECT
      required: true
      options:
        - { value: FEATURE_FLAG, label: "Feature flag por hub, com rollback" }
        - { value: DUAL_WRITE, label: "Execução dupla gravando nos dois caminhos" }
        - { value: WINDOW_CUTOVER, label: "Corte em uma janela de manutenção" }
    - id: qualityMetric
      label: "Métrica que define rota boa"
      type: SELECT
      required: true
      options:
        - { value: km-and-ontime, label: "Quilômetro rodado e entregas no prazo" }
        - { value: identical-output, label: "Rotas idênticas às do job antigo" }
        - { value: driver-opinion, label: "Percepção do motorista" }
    - id: solutionPath
      label: "Destino"
      type: SELECT
      required: true
      options:
        - { value: parallel-by-hub, label: "Paralelizar por hub" }
        - { value: checkpoint-resume, label: "Checkpoint e retomada" }
        - { value: extract-service, label: "Serviço de otimização sob demanda" }
    - id: plan
      label: "Plano de migração"
      type: MARKDOWN
      required: true
      help: "Diagnóstico, estratégia, prova de paridade, rollout, riscos e desligamento do legado."
reference: |
  ## Diagnóstico
  Três problemas somados no job atual:

  1. **Acoplamento por acidente.** Cada iteração lê pacotes e motoristas de um hub e grava rotas daquele hub. Não há
     estado compartilhado entre hubs. Eles estão no mesmo processo por como o código foi escrito, não por necessidade.
  2. **`DELETE` de escopo global.** A primeira linha apaga as rotas do dia de **todos** os hubs. Isso torna qualquer
     paralelismo ou retomada perigoso e transforma uma falha no meio em "nenhum hub tem rota".
  3. **Um único evento no fim.** `routing.assigned` é publicado uma vez para todos. Quem consome não sabe que o hub 3
     está pronto há duas horas.

  Com {{minutesPerHub}} minutos por hub e {{hubs}} hubs em sequência, o tempo de parede é a **soma**; paralelizado,
  passa a ser o **máximo**.

  ## Estratégia: paralelizar por hub, em quatro passos
  **Passo 1 (semana 1) — corrigir o escopo.** `DELETE ... WHERE route_date = ? AND hub_id = ?`, e o evento passa a ser
  por hub. Sozinho, isso já permite reprocessar um hub sem tocar nos outros, e é a mudança de menor risco.

  **Passo 2 (semanas 2 e 3) — medir qualidade.** Antes de mudar o cálculo, definir o número:
  quilômetro total por rota, paradas por rota e percentual de paradas com ETA dentro do prazo prometido. Coletado do
  job atual por 10 dias para virar a linha de base.

  **Passo 3 (semanas 3 e 4) — paralelizar.** O orquestrador enfileira um trabalho por hub em `routing.assigned`;
  workers consomem com paralelismo limitado (começar em 4, subir medindo o `routing-db`). Cada worker tem sua
  transação, seu retry com backoff e seu evento de conclusão. Execução em **sombra** durante todo o período: o job
  antigo continua sendo a verdade, o novo grava em tabelas espelho e a comparação diária publica as três métricas.

  **Passo 4 (semana 5) — corte por hub.** Flag por hub: um hub piloto pequeno por 5 dias, depois 20%, depois o resto.
  Rollback é desligar a flag, porque o job antigo nunca foi removido. Desligamento definitivo 30 dias após o último hub.

  ## Concorrência
  Trinta e quatro execuções simultâneas mudam o perfil do `routing-db`: as inserções em `route_stops` passam a
  concorrer. Limite inicial de 4 workers, transações por rota em vez de por hub, e `lock_timeout` no role do job.
  Meta: tempo de parede abaixo de {{minutesPerHub}} minutos mais folga, com a expansão para {{hubsAfter}} hubs
  absorvida por mais workers e não por mais tempo.

  ## Riscos assumidos
  - Dois caminhos convivendo por cerca de seis semanas, com custo de manutenção dobrado e data de fim definida.
  - O solver é heurístico: as rotas **não** serão idênticas, e isso precisa estar combinado com a operação antes do
    primeiro corte, senão a primeira diferença vira desconfiança.
  - Paralelismo alto demais pode degradar o `routing-db` durante a janela; por isso começa em 4 e sobe medindo.
scenario:
  kind: capacity
  params:
    service: routing-service
    datastore: routing-db
    growthPercentPerMonth: "7"
    currentPeakRps: "60"
    headroomMetric: write_iops
    headroomLimit: "9000"
    headroomNow: "4100"
    storageNowGb: "2400"
recommendation:
  default: parallel-by-hub
  rules:
    - { param: failuresLastMonth, op: ">=", value: 6, path: checkpoint-resume, reason: "com {{failuresLastMonth}} falhas no mês o sangramento é agora; o checkpoint entra em dias e compra a folga necessária para fazer a paralelização com calma" }
