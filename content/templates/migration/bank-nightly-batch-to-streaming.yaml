      label: "Estratégia de migração"
      type: SELECT
      required: true
      options:
        - { value: STRANGLER, label: "Strangler fig (fatias com o legado em paralelo)" }
        - { value: REWRITE, label: "Reescrita do job no mesmo modelo" }
        - { value: OFFLOAD, label: "Isolar e otimizar antes de decidir" }
        - { value: BIG_BANG, label: "Reescrever e trocar de uma vez" }
    - id: rolloutStrategy
      label: "Estratégia de rollout"
      type: SELECT
      required: true
      options:
        - { value: FEATURE_FLAG, label: "Feature flag por fatia, com rollback" }
        - { value: DUAL_WRITE, label: "Escrita dupla nos dois caminhos" }
        - { value: WINDOW_CUTOVER, label: "Corte em janela de manutenção" }
    - id: solutionPath
      label: "Destino"
      type: SELECT
      required: true
      options:
        - { value: strangler-streaming, label: "Processamento contínuo por eventos" }
        - { value: rewrite-chunked-job, label: "Job em lotes curtos" }
        - { value: offload-and-optimize, label: "Isolar e otimizar" }
    - id: plan
      label: "Plano de migração"
      type: MARKDOWN
      required: true
      help: "Fatias, prova de paridade, rollout, rollback, fronteira do que segue em lote e desligamento do legado."
reference: |
  ## Diagnóstico do legado
  A procedure tem três problemas somados:
  1. **Laço linha a linha** com uma consulta a `ledger_entries` por linha do arquivo — {{linesPerNight|number}} consultas por noite.
  2. **Transações gigantes** entre commits de 100 mil linhas, segurando locks por minutos (é a origem dos incidentes de escrita travada).
  3. **Recálculo completo** da agenda do dia: `DELETE` + `INSERT ... SELECT` sobre toda a janela, mesmo quando 99% não mudou.

  Distribuído ao longo do dia, o volume é de apenas **{{linesPerSecondIfStreamed}} linhas por segundo** — a carga não é o
  problema; a concentração na janela é.

  ## Estratégia: strangler em quatro fatias
  O legado continua rodando e sendo a verdade até cada fatia estabilizar.

  **Fatia 1 — Agenda de recebíveis (4 semanas).** O recálculo completo vira atualização incremental por evento
  (`LedgerEntryCreated` via outbox/CDC). É a fatia com maior impacto de negócio e menor risco regulatório: a conciliação
  não muda. Sai do caminho crítico da janela o passo mais caro.

  **Fatia 2 — Casamento contínuo (6 semanas).** O que dá para casar durante o dia (lançamentos internos com referência
  conhecida) passa a ser conciliado continuamente. O batch da madrugada passa a tratar só o que sobrou.

  **Fatia 3 — Fechamento com o arquivo da CIP (6 semanas).** O arquivo chega uma vez por dia e **continua em lote** —
  essa é a fronteira honesta: processamento contínuo não elimina o fechamento, reduz o escopo dele. Reescrito com
  processamento por conjunto (`JOIN` em lote sobre `cip_staging`), lotes de 5.000 linhas e checkpoint por lote.

  **Fatia 4 — Desligamento (2 semanas).** Procedure removida, com o código arquivado e a documentação do comportamento
  extraída das divergências observadas.

  ## Prova de paridade (obrigatória em todas as fatias)
  Execução em **sombra**: o caminho novo roda sobre os mesmos dados, grava em tabelas espelho e um job compara os
  resultados todo dia, publicando: total de itens, itens só no antigo, só no novo, e diferença de valor. Critério de
  promoção: **14 dias consecutivos com divergência zero em valor** e apenas divergências explicadas em quantidade.
  Cada divergência vira teste de regressão — é assim que a regra não documentada vira documentação.

  ## Rollout e rollback
  Feature flag por **arranjo de pagamento** e por **faixa de lojista**: 1% → 10% → 50% → 100%, com pelo menos 5 dias em
  cada degrau. Rollback é desligar a flag: o caminho antigo nunca foi removido e continua processando tudo em sombra até
  o degrau de 100% completar 30 dias.

  ## Contenção imediata (primeira semana, em paralelo)
  - `idle_in_transaction_session_timeout` e `lock_timeout` no role do batch, para que estourar a janela não trave mais o online.
  - Commit por lote de 5.000 em vez de 100.000 — mudança de uma linha, elimina a transação gigante.
  - Alarme de "janela estourada" às 0{{windowHours}}:30, em vez de descobrir pela reclamação do lojista.

  ## O que muda para o negócio
  Detecção de divergência cai de D+1 para minutos. A agenda de recebíveis fica disponível ao longo do dia, não só de
  manhã. O risco regulatório diminui porque a conciliação deixa de depender de uma janela única — mas o fechamento
  diário com a CIP **continua existindo**, e é ele que permanece como evidência para a auditoria.

  ## Riscos assumidos
  - Dois caminhos convivendo por ~4 meses: custo de manutenção dobrado nesse período, com data de fim definida.
  - CDC/outbox no `core-db` adiciona carga de escrita (~3% medidos em homologação).
  - Time de {{teamSize}} pessoas mantendo o legado enquanto migra: as fatias foram dimensionadas para uma pessoa por vez,
    não para o time inteiro.
scenario:
  kind: none
recommendation:
  default: strangler-streaming
  rules:
    - { param: batchHours, op: "<=", value: 5, path: rewrite-chunked-job, reason: "com {{batchHours}}h de execução o estouro da janela ainda é pequeno; reescrever o job em lotes curtos resolve o prazo imediato sem colocar quatro meses de migração no caminho de uma squad de {{teamSize}} pessoas" }
