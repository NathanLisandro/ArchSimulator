services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archsim
      POSTGRES_USER: archsim
      POSTGRES_PASSWORD: archsim
    ports: ["5433:5432"]   # 5433 no host para não brigar com um Postgres local
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archsim"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: archsim-infrastructure/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/archsim
      SPRING_DATASOURCE_USERNAME: archsim
      SPRING_DATASOURCE_PASSWORD: archsim
      ARCHSIM_CONTENT_PATH: /content
    volumes: [./content:/content:ro]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
